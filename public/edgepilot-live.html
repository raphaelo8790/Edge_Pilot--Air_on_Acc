<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EdgePilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>/* EdgePilot benchmark dashboard — "mission control" design system.
   Module-scoped under .epd (nothing leaks into other pages).
   Dark-first premium look: graphite surfaces, glass cards, indigo→cyan
   accent. Provider series colors are the CVD-validated dark-surface set;
   color follows the provider entity, never rank or state. */

.epd {
  --bg-0: #0b0e14;
  --bg-glow-1: rgba(99, 102, 241, 0.14);
  --bg-glow-2: rgba(34, 211, 238, 0.08);
  --surface-1: rgba(255, 255, 255, 0.03);
  --surface-2: rgba(255, 255, 255, 0.055);
  --surface-solid: #131824;
  --border: rgba(255, 255, 255, 0.09);
  --border-strong: rgba(255, 255, 255, 0.16);
  --text-primary: #eef1f7;
  --text-secondary: #a3adc2;
  --text-muted: #6b7690;

  --accent: #6366f1;
  --accent-2: #22d3ee;
  --accent-grad: linear-gradient(135deg, #6366f1 0%, #22d3ee 100%);
  --accent-ink: #ffffff;
  --ring: #22d3ee;

  /* provider slots (fixed, CVD-validated on dark): ollama / gemini / groq */
  --series-ollama: #3987e5;
  --series-gemini: #199e70;
  --series-groq: #c98500;

  --status-good: #34d399;
  --status-good-bg: rgba(52, 211, 153, 0.12);
  --status-warn: #fbbf24;
  --status-warn-bg: rgba(251, 191, 36, 0.1);
  --status-serious: #f87171;
  --status-serious-bg: rgba(248, 113, 113, 0.1);

  --header-bg: rgba(11, 14, 20, 0.75);
  --input-bg: rgba(0, 0, 0, 0.32);
  --code-bg: rgba(255, 255, 255, 0.07);
  --track-bg: rgba(255, 255, 255, 0.06);
  --tbl-bg: rgba(0, 0, 0, 0.25);
  --chip-bg: rgba(255, 255, 255, 0.08);
  --gauge-track: rgba(255, 255, 255, 0.07);

  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset,
    0 10px 30px rgba(0, 0, 0, 0.45);

  color-scheme: dark;
  background: var(--bg-0);
  background-image: radial-gradient(1100px 500px at 15% -10%, var(--bg-glow-1), transparent 60%),
    radial-gradient(900px 480px at 90% 0%, var(--bg-glow-2), transparent 55%);
  background-attachment: fixed;
  color: var(--text-primary);
  min-height: 100vh;
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
    sans-serif;
  font-size: 15px;
  line-height: 1.6;
  letter-spacing: 0.01em;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  --ease: cubic-bezier(0.32, 0.72, 0, 1); /* Apple-style spring-out */
}

.epd *,
.epd *::before,
.epd *::after {
  box-sizing: border-box;
}

.epd a {
  color: var(--accent-2);
  text-decoration: none;
}
.epd a:hover {
  text-decoration: underline;
}

.epd :focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
  border-radius: 6px;
}
/* The step container receives programmatic focus for screen-reader users;
   a visible ring around the whole card is noise, not signal. */
.epd [tabindex="-1"]:focus,
.epd [tabindex="-1"]:focus-visible {
  outline: none;
}

.epd .sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* ---------- header ---------- */

.epd .epd-header {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  padding: 14px 28px;
  background: var(--header-bg);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}
.epd .epd-logo {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  background: var(--accent-grad);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 15px;
  color: #fff;
  box-shadow: 0 4px 14px rgba(99, 102, 241, 0.45);
  flex: none;
}
.epd .epd-brand {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.01em;
  display: flex;
  align-items: center;
  gap: 10px;
}
.epd .epd-brand span {
  background: var(--accent-grad);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.epd .epd-tagline {
  color: var(--text-muted);
  font-size: 12.5px;
}
.epd .epd-live {
  margin-left: auto;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  color: var(--text-secondary);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 5px 12px;
  background: var(--surface-1);
}
.epd .epd-live::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--status-good);
  box-shadow: 0 0 8px var(--status-good);
}

.epd .epd-main {
  max-width: 1080px;
  margin: 0 auto;
  padding: 28px 18px 110px;
}
@media (min-width: 700px) {
  .epd .epd-main {
    padding: 40px 28px 130px;
  }
}

/* ---------- stepper ---------- */

.epd .stepper {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  padding: 6px;
  margin: 0 0 28px;
  list-style: none;
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 999px;
  width: fit-content;
}
.epd .stepper li {
  display: flex;
}
.epd .stepper button {
  display: flex;
  align-items: center;
  gap: 9px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-secondary);
  border-radius: 999px;
  padding: 8px 16px;
  font-size: 13px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  transition: color 0.25s var(--ease), background 0.25s var(--ease);
}
.epd .stepper button:hover:not(:disabled) {
  color: var(--text-primary);
}
.epd .stepper button:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}
.epd .stepper button[aria-current="step"] {
  background: var(--accent-grad);
  color: #fff;
  font-weight: 600;
  box-shadow: 0 4px 16px rgba(99, 102, 241, 0.4);
}
.epd .step-index {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 21px;
  height: 21px;
  border-radius: 50%;
  background: var(--chip-bg);
  border: 1px solid var(--border-strong);
  font-size: 11.5px;
  font-variant-numeric: tabular-nums;
}
.epd .stepper button[aria-current="step"] .step-index {
  background: rgba(255, 255, 255, 0.2);
  border-color: rgba(255, 255, 255, 0.35);
  color: #fff;
}
.epd .step-done .step-index {
  background: var(--status-good-bg);
  border-color: var(--status-good);
  color: var(--status-good);
}

/* ---------- cards ---------- */

.epd .card {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 26px 26px 24px;
  margin-bottom: 22px;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  transition: border-color 0.35s var(--ease), box-shadow 0.35s var(--ease);
}
.epd .card:hover {
  border-color: var(--border-strong);
  box-shadow: var(--shadow), 0 0 40px rgba(99, 102, 241, 0.09);
}
.epd .card h2 {
  margin: 0 0 6px;
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -0.015em;
}
.epd .card h3 {
  margin: 24px 0 10px;
  font-size: 13px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: var(--text-secondary);
}
.epd .card-sub {
  color: var(--text-secondary);
  font-size: 13.5px;
  margin: 0 0 18px;
  max-width: 68ch;
}
.epd .card-sub code,
.epd code {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: 0.86em;
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 1px 6px;
}

/* ---------- forms ---------- */

.epd .form-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
}
@media (min-width: 700px) {
  .epd .form-grid {
    grid-template-columns: 1fr 1fr;
  }
  .epd .form-grid .span-2 {
    grid-column: span 2;
  }
}
.epd .field label {
  display: block;
  font-weight: 600;
  font-size: 12.5px;
  margin-bottom: 6px;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.epd .field .hint {
  color: var(--text-muted);
  font-size: 12px;
  margin: -2px 0 8px;
  text-transform: none;
  letter-spacing: normal;
}
.epd .field input,
.epd .field select,
.epd .field textarea {
  width: 100%;
  padding: 11px 13px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--input-bg);
  color: var(--text-primary);
  font: inherit;
  font-size: 14px;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.epd .field input:focus,
.epd .field select:focus,
.epd .field textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
}
.epd .field input::placeholder,
.epd .field textarea::placeholder {
  color: var(--text-muted);
}
.epd .field textarea {
  min-height: 96px;
  resize: vertical;
  line-height: 1.55;
}
.epd .field select option {
  background: var(--surface-solid);
}
.epd .field input[aria-invalid="true"],
.epd .field textarea[aria-invalid="true"] {
  border-color: var(--status-serious);
  box-shadow: 0 0 0 3px rgba(248, 113, 113, 0.18);
}
.epd .error-text {
  color: var(--status-serious);
  font-size: 12.5px;
  margin-top: 6px;
}

/* ---------- radio cards ---------- */

.epd .radio-cards {
  display: grid;
  gap: 12px;
  grid-template-columns: 1fr;
}
@media (min-width: 760px) {
  .epd .radio-cards {
    grid-template-columns: 1fr 1fr 1fr;
  }
}
.epd .radio-card {
  position: relative;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--surface-2);
  padding: 16px;
  cursor: pointer;
  display: block;
  transition: transform 0.25s var(--ease), border-color 0.25s var(--ease),
    box-shadow 0.25s var(--ease);
}
.epd .radio-card:hover:not(.disabled) {
  transform: translateY(-2px);
  border-color: var(--border-strong);
}
.epd .radio-card:has(input:checked) {
  border-color: transparent;
  background:
    linear-gradient(var(--surface-solid), var(--surface-solid)) padding-box,
    var(--accent-grad) border-box;
  box-shadow: 0 8px 24px rgba(99, 102, 241, 0.25);
}
.epd .radio-card:has(input:focus-visible) {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}
.epd .radio-card input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}
.epd .radio-card.disabled {
  opacity: 0.55;
  cursor: not-allowed;
}
.epd .rc-title {
  font-weight: 650;
  font-size: 14.5px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.epd .rc-meta {
  color: var(--text-secondary);
  font-size: 12.5px;
  margin-top: 5px;
  display: block;
  line-height: 1.5;
}

/* ---------- buttons ---------- */

.epd .btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: var(--surface-2);
  color: var(--text-primary);
  padding: 11px 20px;
  font: inherit;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease),
    border-color 0.25s var(--ease);
}
.epd .btn:hover:not(:disabled) {
  border-color: var(--accent-2);
  transform: translateY(-1px);
}
.epd .btn:active:not(:disabled) {
  transform: translateY(0);
}
.epd .btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
.epd .btn-primary {
  background: var(--accent-grad);
  border: none;
  color: var(--accent-ink);
  box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
}
.epd .btn-primary:hover:not(:disabled) {
  box-shadow: 0 8px 26px rgba(99, 102, 241, 0.55);
}
.epd .btn-row {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 22px;
  align-items: center;
}

/* ---------- badges ---------- */

.epd .badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 0.03em;
  padding: 3px 10px;
  border: 1px solid transparent;
  white-space: nowrap;
}
.epd .badge-measured {
  background: var(--status-good-bg);
  color: var(--status-good);
  border-color: rgba(52, 211, 153, 0.4);
}
.epd .badge-derived {
  background: var(--chip-bg);
  color: var(--text-secondary);
  border-color: var(--border-strong);
}
.epd .badge-assumption,
.epd .badge-simulated {
  background: var(--status-warn-bg);
  color: var(--status-warn);
  border-color: rgba(251, 191, 36, 0.4);
}
.epd .badge-failed {
  background: var(--status-serious-bg);
  color: var(--status-serious);
  border-color: rgba(248, 113, 113, 0.4);
}
.epd .swatch {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 3px;
  flex: none;
  box-shadow: 0 0 6px currentColor;
}

/* ---------- tables ---------- */

.epd .table-wrap {
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--tbl-bg);
}
.epd table.data {
  border-collapse: collapse;
  width: 100%;
  font-size: 13.5px;
}
.epd table.data th,
.epd table.data td {
  text-align: left;
  padding: 11px 14px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}
.epd table.data thead th {
  position: sticky;
  top: 0;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  background: var(--surface-solid);
}
.epd table.data tbody tr {
  transition: background 0.12s ease;
}
.epd table.data tbody tr:hover {
  background: rgba(99, 102, 241, 0.07);
}
.epd table.data tbody tr:last-child td {
  border-bottom: none;
}
.epd td.num,
.epd th.num {
  text-align: right;
  font-variant-numeric: tabular-nums;
}

/* ---------- stat tiles ---------- */

.epd .stat-row {
  display: grid;
  gap: 14px;
  grid-template-columns: repeat(2, 1fr);
  margin: 6px 0 22px;
}
@media (min-width: 800px) {
  .epd .stat-row {
    grid-template-columns: repeat(4, 1fr);
  }
}
.epd .stat {
  position: relative;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px 18px 14px;
  overflow: hidden;
}
.epd .stat::before {
  content: "";
  position: absolute;
  inset: 0 auto auto 0;
  width: 100%;
  height: 2px;
  background: var(--accent-grad);
  opacity: 0.85;
}
.epd .stat-label {
  font-size: 11.5px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  margin: 0 0 4px;
}
.epd .stat-value {
  font-size: 26px;
  font-weight: 750;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
  margin: 0;
}
.epd .stat-sub {
  font-size: 11.5px;
  color: var(--text-muted);
  margin: 3px 0 0;
}

/* ---------- score bars ---------- */

.epd .bar-row {
  display: grid;
  grid-template-columns: minmax(120px, 190px) 1fr 84px;
  align-items: center;
  gap: 12px;
  padding: 5px 0;
  font-size: 13px;
}
.epd .bar-label {
  display: flex;
  align-items: center;
  gap: 8px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text-secondary);
  font-weight: 500;
}
.epd .bar-track {
  background: var(--track-bg);
  border-radius: 5px;
  height: 10px;
  position: relative;
  overflow: hidden;
}
.epd .bar-fill {
  display: block;
  height: 100%;
  border-radius: 5px;
  min-width: 2px;
  transition: width 0.7s var(--ease);
  background: var(--accent-grad);
  box-shadow: 0 0 12px rgba(99, 102, 241, 0.5);
}
.epd .bar-value {
  font-variant-numeric: tabular-nums;
  color: var(--text-primary);
  font-weight: 600;
  text-align: right;
}

/* ---------- readiness gauge ---------- */

.epd .gauge-wrap {
  display: flex;
  align-items: center;
  gap: 26px;
  flex-wrap: wrap;
  margin: 6px 0 18px;
}
.epd .gauge {
  --val: 0;
  position: relative;
  width: 132px;
  height: 132px;
  border-radius: 50%;
  background: conic-gradient(
    #6366f1 0deg,
    #22d3ee calc(var(--val) * 3.6deg),
    var(--gauge-track) calc(var(--val) * 3.6deg) 360deg
  );
  display: flex;
  align-items: center;
  justify-content: center;
  flex: none;
  filter: drop-shadow(0 0 18px rgba(34, 211, 238, 0.25));
}
.epd .gauge::before {
  content: "";
  position: absolute;
  inset: 10px;
  border-radius: 50%;
  background: var(--surface-solid);
}
.epd .gauge-num {
  position: relative;
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
}
.epd .gauge-cap {
  position: relative;
  font-size: 12px;
  color: var(--text-muted);
  margin-left: 2px;
}
.epd .gauge-text {
  flex: 1;
  min-width: 240px;
  color: var(--text-secondary);
  font-size: 14px;
  margin: 0;
  max-width: 60ch;
}

/* ---------- async states ---------- */

.epd .state-panel {
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius);
  padding: 40px 24px;
  text-align: center;
  background: var(--surface-1);
}
.epd .state-title {
  font-weight: 700;
  font-size: 15.5px;
  margin: 0 0 6px;
}
.epd .state-detail {
  color: var(--text-secondary);
  font-size: 13.5px;
  max-width: 560px;
  margin: 0 auto 16px;
}
.epd .state-error {
  border-color: rgba(248, 113, 113, 0.5);
  background: var(--status-serious-bg);
}
.epd .state-error .state-title {
  color: var(--status-serious);
}
.epd .spinner {
  display: inline-block;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 3px solid var(--track-bg);
  border-top-color: var(--accent-2);
  animation: epd-spin 0.7s linear infinite;
  margin-bottom: 12px;
}
@keyframes epd-spin {
  to {
    transform: rotate(360deg);
  }
}

/* ---------- callouts & lists ---------- */

.epd .callout {
  border-radius: var(--radius-sm);
  padding: 13px 16px;
  margin: 14px 0;
  font-size: 13px;
  border: 1px solid var(--border-strong);
  background: var(--surface-2);
  line-height: 1.55;
}
.epd .callout-warn {
  background: var(--status-warn-bg);
  border-color: rgba(251, 191, 36, 0.4);
}
.epd .callout-warn strong {
  color: var(--status-warn);
}
.epd .callout-error {
  background: var(--status-serious-bg);
  border-color: rgba(248, 113, 113, 0.4);
}
.epd .callout-error strong {
  color: var(--status-serious);
}
.epd .callout ul {
  margin: 7px 0 0;
  padding-left: 18px;
}
.epd .callout li {
  margin: 3px 0;
}
.epd .list {
  margin: 6px 0 0;
  padding-left: 18px;
  font-size: 13.5px;
  color: var(--text-secondary);
}
.epd .list li {
  margin: 4px 0;
}

/* ---------- motion ---------- */

.epd .card,
.epd .stat {
  animation: epd-rise 0.5s var(--ease) both;
}
@keyframes epd-rise {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
@media (prefers-reduced-motion: reduce) {
